name: Runtime integration (unofficial)
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build this SDK and CLI from TypeScript
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/NemoClaw
          ref: 1eb370f20530bd1312ac86a27782ef8501b28ade
          path: .upstream/NemoClaw
          persist-credentials: false
      - name: Build actual NemoClaw CLI from pinned upstream source
        id: cli
        working-directory: .upstream/NemoClaw
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix nemoclaw ci --ignore-scripts --no-audit --no-fund
          npm run build:cli
          node bin/nemoclaw.js --version
      - name: Verify a generated native agent against the real loader
        id: native-loader
        continue-on-error: true
        run: |
          mkdir -p reports
          node scripts/integration/native-agent.mjs --nemoclaw .upstream/NemoClaw --name native-echo --json reports/native-loader.json
      - name: Install OpenShell v0.0.116 and verify checksum
        id: openshell
        run: |
          mkdir -p "$RUNNER_TEMP/openshell" "$HOME/.local/bin" reports
          cd "$RUNNER_TEMP/openshell"
          base=https://github.com/NVIDIA/OpenShell/releases/download/v0.0.116
          curl -fsSLO "$base/openshell-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "$base/openshell-checksums-sha256.txt"
          grep ' openshell-x86_64-unknown-linux-musl.tar.gz$' openshell-checksums-sha256.txt | sha256sum --check --strict
          tar -xzf openshell-x86_64-unknown-linux-musl.tar.gz
          install -m 0755 "$(find . -type f -name openshell | head -1)" "$HOME/.local/bin/openshell"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/openshell" --version
      - name: Actual NemoClaw onboarding with fixture provider
        id: onboard
        continue-on-error: true
        env:
          NEMOCLAW_PROVIDER: custom
          NEMOCLAW_MODEL: fixture-model
          NEMOCLAW_PROVIDER_KEY: fixture-only-not-a-secret
          NEMOCLAW_ENDPOINT_URL: http://host.openshell.internal:18080/v1
        run: |
          node scripts/integration/fixture-provider.mjs > "$RUNNER_TEMP/provider.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/provider.pid"
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18080/v1/models
          set +e
          timeout 900 node .upstream/NemoClaw/bin/nemoclaw.js onboard --name nha-host --agent openclaw --no-gpu --no-sandbox-gpu --non-interactive --yes --yes-i-accept-third-party-software > "$RUNNER_TEMP/onboard.log" 2>&1
          rc=$?
          echo "Actual NemoClaw onboarding exit code: $rc"
          if [ "$rc" != 0 ]; then
            tail -n 30 "$RUNNER_TEMP/onboard.log"
            log="$HOME/.local/state/nemoclaw/openshell-docker-gateway/openshell-gateway.log"
            if test -f "$log"; then grep -Ei 'error|warn|inference' "$log" | tail -n 25; fi
          fi
          exit "$rc"
      - name: Onboard and execute the generated native agent in a real sandbox
        id: native
        if: ${{ !cancelled() && steps.openshell.outcome == 'success' }}
        continue-on-error: true
        env:
          NEMOCLAW_PROVIDER: custom
          NEMOCLAW_MODEL: fixture-model
          NEMOCLAW_PROVIDER_KEY: fixture-only-not-a-secret
          NEMOCLAW_ENDPOINT_URL: http://host.openshell.internal:18080/v1
        run: |
          mkdir -p reports
          node scripts/integration/native-agent.mjs --nemoclaw .upstream/NemoClaw --name native-echo --sandbox nha-native --deploy --json reports/native.json
      - name: Build generated adapter and test real OpenShell BYOC
        id: byoc
        if: ${{ !cancelled() && steps.openshell.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          node bin/nha.mjs init "$RUNNER_TEMP/harness" --name integration-echo
          cp scripts/integration/sandbox-smoke.mjs "$RUNNER_TEMP/harness/integration-smoke.mjs"
          printf '\nUSER root\nRUN mkdir /policy-probe && chmod 0777 /policy-probe && echo test-only > /policy-probe/readable.txt && chmod 0644 /policy-probe/readable.txt\nUSER 1000:1000\n' >> "$RUNNER_TEMP/harness/Dockerfile"
          docker build --build-arg BASE_IMAGE=node:24-bookworm-slim -t nha-integration:dev "$RUNNER_TEMP/harness" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/build.log"; exit 1; }
          docker image inspect nha-integration:dev --format '{{.Id}}' > reports/image-id.txt
          if ! timeout 180 node bin/nha.mjs launch --name nha-integration --image nha-integration:dev --dev-image --policy "$RUNNER_TEMP/harness/policy.yaml" --task NHA_LIVE_OK 2>&1 | tee "$RUNNER_TEMP/live.txt"; then
            openshell sandbox get nha-integration || true
            for cid in $(docker ps -aq --filter ancestor=nha-integration:dev); do
              docker inspect --format '{{json .State}}' "$cid"
              docker logs --tail 80 "$cid" 2>&1
            done
            exit 1
          fi
          if ! grep -F 'Echo: NHA_LIVE_OK' "$RUNNER_TEMP/live.txt"; then
            openshell sandbox get nha-integration || true
            for cid in $(docker ps -aq --filter ancestor=nha-integration:dev); do
              docker inspect --format '{{json .State}}' "$cid"
              docker logs --tail 80 "$cid" 2>&1
            done
            exit 1
          fi
          openshell sandbox exec -n nha-integration -- node /opt/nha/integration-smoke.mjs byoc | tee reports/byoc.json
      - name: Run harness suite inside the actual NemoClaw-managed sandbox
        id: embedded
        if: ${{ !cancelled() && steps.openshell.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          node .upstream/NemoClaw/bin/nemoclaw.js list
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/harness.tar" harness
          node .upstream/NemoClaw/bin/nemoclaw.js nha-host upload "$RUNNER_TEMP/harness.tar" /sandbox/harness.tar
          node .upstream/NemoClaw/bin/nemoclaw.js nha-host exec -- tar -xf /sandbox/harness.tar -C /sandbox
          node .upstream/NemoClaw/bin/nemoclaw.js nha-host exec -- node /sandbox/harness/integration-smoke.mjs embedded | tee reports/nemoclaw.json
      - name: Record outcomes without hiding deployment failures
        if: always()
        env:
          CLI_RESULT: ${{ steps.cli.outcome }}
          NATIVE_LOADER_RESULT: ${{ steps.native-loader.outcome }}
          ONBOARD_RESULT: ${{ steps.onboard.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          BYOC_RESULT: ${{ steps.byoc.outcome }}
          EMBEDDED_RESULT: ${{ steps.embedded.outcome }}
        run: |
          mkdir -p reports
          node --input-type=module -e '
            import fs from "node:fs";
            const results = Object.fromEntries(["CLI", "NATIVE_LOADER", "ONBOARD", "NATIVE", "BYOC", "EMBEDDED"].map(k => [k.toLowerCase(), process.env[k + "_RESULT"]]));
            const report = { unofficial: true, commit: process.env.GITHUB_SHA, nemoclawCommit: "1eb370f20530bd1312ac86a27782ef8501b28ade", openshell: "0.0.116", arch: process.arch, realModel: false, results };
            fs.writeFileSync("reports/deployment.json", JSON.stringify(report, null, 2) + "\n");
            console.log(JSON.stringify(report));
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-evidence
          path: reports/
          retention-days: 14
      - name: Cleanup disposable sandboxes
        if: always()
        run: |
          if command -v openshell >/dev/null; then
            openshell sandbox list || true
            openshell sandbox delete nha-integration || true
            openshell sandbox delete nha-native || true
          openshell sandbox delete nha-host || true
          fi
          if test -f "$RUNNER_TEMP/provider.pid"; then kill "$(cat "$RUNNER_TEMP/provider.pid")" || true; fi
      - name: Require all deployment checks to pass
        if: always()
        env:
          ONBOARD_RESULT: ${{ steps.onboard.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          BYOC_RESULT: ${{ steps.byoc.outcome }}
          EMBEDDED_RESULT: ${{ steps.embedded.outcome }}
        run: test "$ONBOARD_RESULT/$NATIVE_RESULT/$BYOC_RESULT/$EMBEDDED_RESULT" = success/success/success/success
