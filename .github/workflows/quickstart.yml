name: Native quickstart (clean environment, unofficial)
# Proves the documented quickstart works from a fresh machine with no prior NemoClaw state.
# This job is deliberately native-only: it never onboards OpenClaw first, so it shows the
# agents/<name>/ path stands on its own.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fail fast if the runner already has NemoClaw state
        run: |
          if [ -e "$HOME/.local/state/nemoclaw" ]; then
            echo "This job must start clean, but NemoClaw state already exists." >&2
            exit 1
          fi
          echo "No pre-existing NemoClaw state."
      - name: Build the TypeScript SDK and CLI
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run the quickstart exactly as documented
        id: quickstart
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/quickstart.mjs --workdir "$RUNNER_TEMP/quickstart" --destroy --customize --json reports/quickstart.json 2>&1 | tee "$RUNNER_TEMP/quickstart.log"
      - name: Record the pinned versions used
        if: always()
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "nemoclawRevision: 1ccec4e141b0a830229ef68c96639851d24810fd"
            echo "arch: $(uname -m)"
            echo "node: $(node --version)"
            echo "docker: $(docker --version)"
            echo "trustedCILog: "The checksum-pinned OpenShell install is the same command the quickstart documents.""
          } > "$RUNNER_TEMP/quickstart-versions.txt"
          cat "$RUNNER_TEMP/quickstart-versions.txt"
      - name: Clean up the sandbox owned by the quickstart
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          QUICKSTART_RESULT: ${{ steps.quickstart.outcome }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { cleanupSandbox, serializeReport, writeReportAtomically } from './scripts/lib/qualification.mjs';
          let report;
          try {
            if (!fs.existsSync('reports/quickstart.json')) {
              report = { status: process.env.QUICKSTART_RESULT === 'success' ? 'failed' : 'skipped', detail: 'No quickstart ownership receipt' };
            } else {
              const receipt = JSON.parse(fs.readFileSync('reports/quickstart.json', 'utf8'));
              if (receipt.sandbox?.ownership !== 'owned' || receipt.stages?.cleanup?.status === 'passed') {
                report = { status: 'skipped', detail: 'No owned sandbox remains to clean up' };
              } else {
                if (!receipt.sandbox.name || !receipt.checkout || !receipt.gateway?.name || !receipt.gateway.port || !receipt.gateway.workspace || receipt.nativeState?.ownership !== 'owned') {
                  throw new Error('Quickstart receipt is missing native ownership or gateway binding');
                }
                // Retry the supported lifecycle operation; never bypass a retained-state refusal.
                if (receipt.stages?.cleanup?.status === 'running') receipt.stages.cleanup = { status: 'failed', reason: 'prior workflow step has ended' };
                await cleanupSandbox(receipt, { deploy: true, gateway: receipt.gateway.name, gatewayPort: receipt.gateway.port });
                report = { ...receipt.stages.cleanup, sandbox: receipt.sandbox.name, gateway: receipt.gateway };
              }
            }
          } catch (error) { report = { status: 'failed', detail: error.message }; }
          await writeReportAtomically('reports/quickstart-cleanup.json', report);
          console.log(serializeReport(report));
          process.exitCode = ['passed', 'skipped'].includes(report.status) ? 0 : 1;
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quickstart-evidence
          path: |
            ${{ runner.temp }}/quickstart.log
            ${{ runner.temp }}/quickstart-versions.txt
            reports/quickstart.json
            reports/quickstart-cleanup.json
          retention-days: 14
      - name: Require the quickstart and cleanup to pass
        if: always()
        env:
          QUICKSTART_RESULT: ${{ steps.quickstart.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
        run: test "$QUICKSTART_RESULT/$CLEANUP_RESULT" = success/success
