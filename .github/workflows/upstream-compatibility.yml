name: NemoClaw upstream compatibility (unofficial)
on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build the SDK used by the qualification runner
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/NemoClaw
          ref: 1ccec4e141b0a830229ef68c96639851d24810fd
          path: .upstream/NemoClaw-pinned
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/NemoClaw
          ref: main
          path: .upstream/NemoClaw-main
          persist-credentials: false
      - name: Install pinned OpenShell runtime
        id: openshell
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}/nha-compat-home
          NEMOCLAW_NON_INTERACTIVE: '1'
        run: |
          mkdir -p "$HOME" "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash .upstream/NemoClaw-pinned/scripts/install-openshell.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          openshell --version
          openshell_dir="$(dirname "$(command -v openshell)")"
          test -x "$openshell_dir/openshell-gateway"
          test -x "$openshell_dir/openshell-sandbox"
          echo "OpenShell CLI, gateway, and sandbox installed in $openshell_dir"
      - name: Bootstrap and verify the managed gateway
        id: gateway
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}/nha-compat-home
          NEMOCLAW_GATEWAY_PORT: '8080'
          NEMOCLAW_NON_INTERACTIVE: '1'
        run: |
          set -o pipefail
          mkdir -p "$HOME"
          : > "$RUNNER_TEMP/compat-gateway-bootstrap.log"
          export PATH="$HOME/.local/bin:$PATH"
          cd .upstream/NemoClaw-pinned
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix nemoclaw ci --ignore-scripts --no-audit --no-fund
          npm run build:cli
          node --input-type=commonjs -e '
            const onboard = require("./dist/lib/onboard.js");
            if (typeof onboard.startDockerDriverGateway !== "function") {
              console.error("The pinned NemoClaw checkout does not export startDockerDriverGateway, so the managed gateway cannot be started before the sandbox probe.");
              process.exit(1);
            }
            Promise.resolve(onboard.startDockerDriverGateway({
              exitOnFailure: false,
            })).then(() => process.exit(0)).catch((error) => {
              console.error(error instanceof Error ? error.stack || error.message : String(error));
              process.exit(1);
            });
          ' 2>&1 | tee "$RUNNER_TEMP/compat-gateway-bootstrap.log"
          openshell gateway select nemoclaw 2>&1 | tee -a "$RUNNER_TEMP/compat-gateway-bootstrap.log"
          openshell status -g nemoclaw 2>&1 | tee -a "$RUNNER_TEMP/compat-gateway-bootstrap.log"
          openshell gateway info -g nemoclaw 2>&1 | tee -a "$RUNNER_TEMP/compat-gateway-bootstrap.log"
      - name: Start deterministic provider fixture
        id: fixture
        if: ${{ !cancelled() && steps.gateway.outcome == 'success' }}
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}/nha-compat-home
          NEMOCLAW_GATEWAY_PORT: '8080'
          NEMOCLAW_PROVIDER: custom
          NEMOCLAW_MODEL: fixture-model
          NEMOCLAW_PROVIDER_KEY: fixture-only-not-a-secret
          NEMOCLAW_ENDPOINT_URL: http://host.openshell.internal:18080/v1
        run: |
          mkdir -p "$HOME"
          node scripts/integration/fixture-provider.mjs > "$RUNNER_TEMP/compat-provider.log" 2>&1 &
          fixture_pid=$!
          echo "$fixture_pid" > "$RUNNER_TEMP/compat-provider.pid"
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/compat-provider.log"
              exit 1
            fi
            if grep -Fq 'Deterministic integration fixture listening; NOT a real model.' "$RUNNER_TEMP/compat-provider.log" && curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:18080/v1/models >/dev/null; then
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/compat-provider.log"
          exit 1
      - name: Qualify pinned and candidate checkouts
        id: compatibility
        if: ${{ !cancelled() && steps.gateway.outcome == 'success' && steps.fixture.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "$HOME"
          mkdir -p reports
          node scripts/compatibility.mjs \
            --checkout pinned=.upstream/NemoClaw-pinned \
            --checkout candidate=.upstream/NemoClaw-main \
            --state-contract candidate=complete-home-v1 \
            --expected pinned=1ccec4e141b0a830229ef68c96639851d24810fd \
            --build \
            --deploy \
            --gateway nemoclaw \
            --sandbox-prefix nha-compat-${GITHUB_RUN_ID} \
            --sandbox-token ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --json reports/nemoclaw-compatibility.json
        env:
          HOME: ${{ runner.temp }}/nha-compat-home
          NEMOCLAW_GATEWAY_PORT: '8080'
          NEMOCLAW_PROVIDER: custom
          NEMOCLAW_MODEL: fixture-model
          NEMOCLAW_PROVIDER_KEY: fixture-only-not-a-secret
          NEMOCLAW_ENDPOINT_URL: http://host.openshell.internal:18080/v1
      - name: Cleanup compatibility sandboxes and fixture
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          OPENSHELL_RESULT: ${{ steps.openshell.outcome }}
          GATEWAY_RESULT: ${{ steps.gateway.outcome }}
          HOME: ${{ runner.temp }}/nha-compat-home
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { cleanupSandbox, run, commandResult, serializeReport, writeReportAtomically } from './scripts/lib/qualification.mjs';
          const results = [];
          if (fs.existsSync('reports/nemoclaw-compatibility.json')) {
            try {
              const receipt = JSON.parse(fs.readFileSync('reports/nemoclaw-compatibility.json', 'utf8'));
              for (const item of receipt.cases ?? []) {
                if (item.sandbox?.ownership !== 'owned' || item.stages?.cleanup?.status === 'passed') continue;
                if (!item.sandbox.name || !item.checkout || !item.gateway?.name || !item.gateway.port || !item.gateway.workspace || item.nativeState?.ownership !== 'owned') {
                  results.push({ resource: item.sandbox?.name, status: 'failed', detail: 'Incomplete native ownership receipt' });
                  continue;
                }
                if (item.stages?.cleanup?.status === 'running') item.stages.cleanup = { status: 'failed', reason: 'prior workflow step has ended' };
                await cleanupSandbox(item, { deploy: true, gateway: item.gateway.name, gatewayPort: item.gateway.port });
                results.push({ ...item.stages.cleanup, resource: item.sandbox.name });
              }
            } catch (error) { results.push({ resource: 'native sandboxes', status: 'failed', detail: error.message }); }
          }
          const pidFile = path.join(process.env.RUNNER_TEMP, 'compat-provider.pid');
          if (fs.existsSync(pidFile)) {
            try {
              const pid = Number(fs.readFileSync(pidFile, 'utf8').trim());
              if (!Number.isSafeInteger(pid) || pid <= 1) throw new Error('Invalid fixture provider PID');
              process.kill(pid, 'SIGTERM');
              results.push({ resource: 'fixture provider', status: 'passed' });
            } catch (error) { results.push({ resource: 'fixture provider', status: error.code === 'ESRCH' ? 'passed' : 'failed', detail: error.message }); }
          }
          if (process.env.OPENSHELL_RESULT === 'success' && ['success', 'failure', 'cancelled'].includes(process.env.GATEWAY_RESULT)) {
            results.push({ ...commandResult(await run(['openshell', 'gateway', 'remove', 'nemoclaw'], { timeoutMs: 60000 })), resource: 'gateway registration' });
          }
          const ok = results.every(result => ['passed', 'skipped'].includes(result.status));
          await writeReportAtomically('reports/compatibility-cleanup.json', { ok, results });
          console.log(serializeReport({ ok, results }));
          process.exitCode = ok ? 0 : 1;
          NODE
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemoclaw-compatibility-report
          path: |
            reports/nemoclaw-compatibility.json
            reports/compatibility-cleanup.json
            ${{ runner.temp }}/compat-gateway-bootstrap.log
          if-no-files-found: error
          retention-days: 30
      - name: Require compatibility qualification to pass
        if: always()
        env:
          OPENSHELL_RESULT: ${{ steps.openshell.outcome }}
          GATEWAY_RESULT: ${{ steps.gateway.outcome }}
          FIXTURE_RESULT: ${{ steps.fixture.outcome }}
          COMPATIBILITY_RESULT: ${{ steps.compatibility.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
        run: test "$OPENSHELL_RESULT/$GATEWAY_RESULT/$FIXTURE_RESULT/$COMPATIBILITY_RESULT/$CLEANUP_RESULT" = success/success/success/success/success
