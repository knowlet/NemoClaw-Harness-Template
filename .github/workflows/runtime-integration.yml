name: Runtime integration (unofficial)
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/NemoClaw
          ref: 1eb370f20530bd1312ac86a27782ef8501b28ade
          path: .upstream/NemoClaw
          persist-credentials: false
      - name: Build actual NemoClaw CLI from pinned upstream source
        working-directory: .upstream/NemoClaw
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix nemoclaw ci --ignore-scripts --no-audit --no-fund
          npm run build:cli
          node bin/nemoclaw.js --version
      - name: Install OpenShell v0.0.116 and verify checksum
        run: |
          mkdir -p "$RUNNER_TEMP/openshell" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/openshell"
          base=https://github.com/NVIDIA/OpenShell/releases/download/v0.0.116
          curl -fsSLO "$base/openshell-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "$base/openshell-checksums-sha256.txt"
          grep ' openshell-x86_64-unknown-linux-musl.tar.gz$' openshell-checksums-sha256.txt | sha256sum --check --strict
          tar -xzf openshell-x86_64-unknown-linux-musl.tar.gz
          install -m 0755 "$(find . -type f -name openshell | head -1)" "$HOME/.local/bin/openshell"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/openshell" --version
      - name: Actual NemoClaw onboarding with deterministic fixture provider
        env:
          NEMOCLAW_PROVIDER: custom
          NEMOCLAW_ENDPOINT_URL: http://127.0.0.1:18080/v1
          NEMOCLAW_MODEL: fixture-model
          NEMOCLAW_PROVIDER_KEY: fixture-only-not-a-secret
        run: |
          set -o pipefail
          node scripts/integration/fixture-provider.mjs > "$RUNNER_TEMP/provider.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/provider.pid"
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18080/v1/models
          timeout 600 node .upstream/NemoClaw/bin/nemoclaw.js onboard --name nha-host --agent openclaw --no-gpu --no-sandbox-gpu --non-interactive --yes --yes-i-accept-third-party-software 2>&1 | tee "$RUNNER_TEMP/onboard.log"
      - name: Build generated adapter image and launch an actual sandbox
        run: |
          set -o pipefail
          node bin/nha.mjs init "$RUNNER_TEMP/harness" --name integration-echo
          docker build --build-arg BASE_IMAGE=node:24-bookworm-slim -t nha-integration:dev "$RUNNER_TEMP/harness"
          timeout 180 node bin/nha.mjs launch --name nha-integration --image nha-integration:dev --dev-image --policy "$RUNNER_TEMP/harness/policy.yaml" --task NHA_LIVE_OK | tee "$RUNNER_TEMP/live.txt"
          grep -F 'Echo: NHA_LIVE_OK' "$RUNNER_TEMP/live.txt"
      - name: Inspect real NemoClaw state and invoke adapter inside its sandbox
        run: |
          set -o pipefail
          node .upstream/NemoClaw/bin/nemoclaw.js list
          node .upstream/NemoClaw/bin/nemoclaw.js nha-host upload "$RUNNER_TEMP/harness" /sandbox/harness
          node .upstream/NemoClaw/bin/nemoclaw.js nha-host exec -- node /sandbox/harness/agent.mjs < /dev/null
      - name: Cleanup disposable sandboxes
        if: always()
        run: |
          if command -v openshell >/dev/null; then
            openshell sandbox list || true
            openshell sandbox delete nha-integration || true
            openshell sandbox delete nha-host || true
          fi
          if test -f "$RUNNER_TEMP/provider.pid"; then kill "$(cat "$RUNNER_TEMP/provider.pid")" || true; fi
